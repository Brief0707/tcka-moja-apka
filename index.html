<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — Reakcie v chate & Nahlasovanie (bez reportu admina)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #0284c7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --admin-badge: #f59e0b;
      --ok: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 18px;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-header h1,
    .card-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .messages {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 62vh;
      overflow-y: auto;
    }

    .msg {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .msg-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .author-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .author {
      font-weight: 700;
      font-size: 14px;
    }

    .badge-admin {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.18);
      color: var(--admin-badge);
      border: 1px solid rgba(245, 158, 11, 0.45);
    }

    .time {
      font-size: 12px;
      color: var(--muted);
    }

    .msg-text {
      font-size: 14px;
      line-height: 1.45;
      margin: 4px 0 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reactions-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .reaction-chip {
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: 0.15s ease;
    }

    .reaction-chip:hover {
      border-color: var(--accent);
    }

    .reaction-chip.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #e0f2fe;
      font-weight: 600;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.2);
    }

    .emoji-picker {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .emoji-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .emoji-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
    }

    .report-btn {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .report-btn:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .protected-note {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    .composer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
      font-family: inherit;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent-2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .side-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .report-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .report-item {
      background: var(--panel-2);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12px;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--ok);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 40;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .modal h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .modal p {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Hlavný chat -->
    <section class="card">
      <div class="card-header">
        <h1>Hlavný chat (reakcie v chate, bez RP)</h1>
        <span class="pill">RP vypnuté • Admin chránený pred reportom</span>
      </div>

      <div id="messagesList" class="messages"></div>

      <form id="chatForm" class="composer">
        <input
          type="text"
          id="messageInput"
          placeholder="Napíš správu do chatu..."
          autocomplete="off"
          required
        />
        <button type="submit" class="btn-primary">Odoslať</button>
      </form>
    </section>

    <!-- Bočný panel -->
    <aside class="card">
      <div class="card-header">
        <h2>Nastavenie a reporty</h2>
      </div>
      <div class="side-body">
        <div>
          <label for="currentUserSelect" class="field-label">Aktuálny používateľ (test):</label>
          <select id="currentUserSelect"></select>
        </div>

        <div>
          <span class="field-label">Prijaté nahlásenia (<span id="reportCount">0</span>):</span>
          <div id="reportsList" class="report-list">
            <div class="report-item" style="border-color: var(--border); color: var(--muted);">
              Zatiaľ žiadne nahlásenia.
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Modálne okno pre nahlásenie -->
  <div id="reportModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <h3>Nahlásiť nevhodné správanie</h3>
      <p id="reportTargetInfo"></p>
      <label for="reportReason" class="field-label">Dôvod nahlásenia:</label>
      <textarea id="reportReason" rows="3" placeholder="Opíš stručne, čo sa stalo..."></textarea>
      <div class="modal-actions">
        <button type="button" id="cancelReportBtn" class="btn-ghost">Zrušiť</button>
        <button type="button" id="confirmReportBtn" class="report-btn" style="padding: 8px 14px; font-size: 13px;">
          Odoslať report
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const EMOJIS = ["👍", "❤️", "😂", "🔥", "😮"];

    const users = [
      { uid: "u1", name: "Marek", role: "user" },
      { uid: "u2", name: "Katka", role: "user" },
      { uid: "a1", name: "Hlavný Admin", role: "admin" }
    ];

    let currentUserId = "u1";
    let pendingReportTarget = null;

    let messages = [
      {
        id: "m1",
        authorId: "a1",
        text: "Vitajte v chate! Reagovať môžete priamo emoji tlačidlami pod správou.",
        time: "14:10",
        reactions: { "👍": ["u1", "u2"] }
      },
      {
        id: "m2",
        authorId: "u2",
        text: "Super, reaguje sa priamo sem do chatu a neposiela sa žiadne RP.",
        time: "14:12",
        reactions: { "❤️": ["u1"] }
      },
      {
        id: "m3",
        authorId: "u1",
        text: "Skúsme otestovať nahlásenie: na bežných používateľov ide, na admina nie.",
        time: "14:15",
        reactions: {}
      }
    ];

    const reports = [];

    const messagesListEl = document.getElementById("messagesList");
    const chatFormEl = document.getElementById("chatForm");
    const messageInputEl = document.getElementById("messageInput");
    const currentUserSelectEl = document.getElementById("currentUserSelect");
    const reportsListEl = document.getElementById("reportsList");
    const reportCountEl = document.getElementById("reportCount");
    const toastEl = document.getElementById("toast");

    const reportModalEl = document.getElementById("reportModal");
    const reportTargetInfoEl = document.getElementById("reportTargetInfo");
    const reportReasonEl = document.getElementById("reportReason");
    const cancelReportBtn = document.getElementById("cancelReportBtn");
    const confirmReportBtn = document.getElementById("confirmReportBtn");

    function getUserById(uid) {
      return users.find((u) => u.uid === uid) || { uid, name: "Neznámy", role: "user" };
    }

    function getCurrentUser() {
      return getUserById(currentUserId);
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2400);
    }

    // Povolené nahlásenie na kohokoľvek OKREM admina (a nie na seba)
    function canReportUser(reporter, target) {
      if (!reporter || !target) return false;
      if (reporter.uid === target.uid) return false;
      if (target.role === "admin") return false;
      return true;
    }

    // Reakcia priamo v chate (bez RP)
    function toggleReaction(messageId, emoji) {
      const msg = messages.find((m) => m.id === messageId);
      if (!msg) return;

      if (!msg.reactions[emoji]) {
        msg.reactions[emoji] = [];
      }

      const idx = msg.reactions[emoji].indexOf(currentUserId);
      if (idx === -1) {
        msg.reactions[emoji].push(currentUserId);
        showToast(`Reakcia ${emoji} pridaná do chatu`);
      } else {
        msg.reactions[emoji].splice(idx, 1);
        if (msg.reactions[emoji].length === 0) {
          delete msg.reactions[emoji];
        }
        showToast(`Reakcia ${emoji} odstránená`);
      }

      renderMessages();
    }

    function openReportModal(targetUser, messageId) {
      const reporter = getCurrentUser();
      if (!canReportUser(reporter, targetUser)) {
        showToast("Admina nie je možné nahlásiť.");
        return;
      }
      pendingReportTarget = { targetUser, messageId };
      reportTargetInfoEl.textContent = `Cieľ: ${targetUser.name} (správa #${messageId})`;
      reportReasonEl.value = "";
      reportModalEl.classList.add("open");
      reportModalEl.setAttribute("aria-hidden", "false");
      reportReasonEl.focus();
    }

    function closeReportModal() {
      pendingReportTarget = null;
      reportModalEl.classList.remove("open");
      reportModalEl.setAttribute("aria-hidden", "true");
    }

    function submitReport() {
      if (!pendingReportTarget) return;
      const reporter = getCurrentUser();
      const { targetUser, messageId } = pendingReportTarget;

      // Dvojitá ochrana aj pri odoslaní
      if (!canReportUser(reporter, targetUser)) {
        showToast("Nahlásenie admina je zablokované.");
        closeReportModal();
        return;
      }

      const reason = reportReasonEl.value.trim() || "Nevhodné správanie v chate";
      reports.unshift({
        id: "r_" + Date.now(),
        reporterName: reporter.name,
        targetName: targetUser.name,
        messageId,
        reason,
        time: new Date().toLocaleTimeString("sk-SK", { hour: "2-digit", minute: "2-digit" })
      });

      renderReports();
      closeReportModal();
      showToast(`Nahlásenie na používateľa ${targetUser.name} bolo odoslané.`);
    }

    function renderUsersSelect() {
      currentUserSelectEl.innerHTML = users
        .map(
          (u) =>
            `<option value="${u.uid}" ${u.uid === currentUserId ? "selected" : ""}>` +
            `${u.name} ${u.role === "admin" ? "(ADMIN)" : "(Používateľ)"}` +
            `</option>`
        )
        .join("");
    }

    function renderMessages() {
      const reporter = getCurrentUser();

      messagesListEl.innerHTML = messages
        .map((msg) => {
          const author = getUserById(msg.authorId);
          const isAdminAuthor = author.role === "admin";

          const chipsHtml = Object.entries(msg.reactions)
            .map(([emoji, uids]) => {
              if (!uids || uids.length === 0) return "";
              const active = uids.includes(currentUserId) ? "active" : "";
              return `<button type="button" class="reaction-chip ${active}" data-react-msg="${msg.id}" data-react-emoji="${emoji}">${emoji} <span>${uids.length}</span></button>`;
            })
            .join("");

          const emojiButtonsHtml = EMOJIS.map(
            (emoji) =>
              `<button type="button" class="emoji-btn" title="Reagovať ${emoji} v chate" data-react-msg="${msg.id}" data-react-emoji="${emoji}">${emoji}</button>`
          ).join("");

          const reportControlHtml = canReportUser(reporter, author)
            ? `<button type="button" class="report-btn" data-report-target="${author.uid}" data-report-msg="${msg.id}">Nahlásiť</button>`
            : `<span class="protected-note">${author.uid === reporter.uid ? "Vlastná správa" : "Admina nemožno nahlásiť"}</span>`;

          return `
            <article class="msg">
              <div class="msg-top">
                <div class="author-wrap">
                  <span class="author">${escapeHtml(author.name)}</span>
                  ${isAdminAuthor ? `<span class="badge-admin">ADMIN</span>` : ""}
                </div>
                <span class="time">${escapeHtml(msg.time)}</span>
              </div>
              <div class="msg-text">${escapeHtml(msg.text)}</div>
              ${chipsHtml ? `<div class="reactions-row">${chipsHtml}</div>` : ""}
              <div class="actions">
                <div class="emoji-picker" aria-label="Reakcie v chate">
                  ${emojiButtonsHtml}
                </div>
                <div>${reportControlHtml}</div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function renderReports() {
      reportCountEl.textContent = String(reports.length);
      if (reports.length === 0) {
        reportsListEl.innerHTML = `<div class="report-item" style="border-color: var(--border); color: var(--muted);">Zatiaľ žiadne nahlásenia.</div>`;
        return;
      }

      reportsListEl.innerHTML = reports
        .map(
          (r) => `
            <div class="report-item">
              <div><strong>${escapeHtml(r.reporterName)}</strong> nahlásil <strong>${escapeHtml(r.targetName)}</strong> (${escapeHtml(r.time)})</div>
              <div style="color: var(--muted); margin-top: 3px;">Dôvod: ${escapeHtml(r.reason)}</div>
            </div>
          `
        )
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    currentUserSelectEl.addEventListener("change", (e) => {
      currentUserId = e.target.value;
      renderMessages();
      showToast(`Prepnuté na: ${getCurrentUser().name}`);
    });

    chatFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = messageInputEl.value.trim();
      if (!text) return;

      messages.push({
        id: "m" + (messages.length + 1),
        authorId: currentUserId,
        text,
        time: new Date().toLocaleTimeString("sk-SK", { hour: "2-digit", minute: "2-digit" }),
        reactions: {}
      });

      messageInputEl.value = "";
      renderMessages();
      messagesListEl.scrollTop = messagesListEl.scrollHeight;
    });

    messagesListEl.addEventListener("click", (e) => {
      const reactBtn = e.target.closest("[data-react-msg]");
      if (reactBtn) {
        toggleReaction(reactBtn.dataset.reactMsg, reactBtn.dataset.reactEmoji);
        return;
      }

      const reportBtn = e.target.closest("[data-report-target]");
      if (reportBtn) {
        const targetUser = getUserById(reportBtn.dataset.reportTarget);
        openReportModal(targetUser, reportBtn.dataset.reportMsg);
      }
    });

    cancelReportBtn.addEventListener("click", closeReportModal);
    confirmReportBtn.addEventListener("click", submitReport);
    reportModalEl.addEventListener("click", (e) => {
      if (e.target === reportModalEl) closeReportModal();
    });

    renderUsersSelect();
    renderMessages();
    renderReports();
  </script>
</body>
</html>
